<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Steer Options</title>
  <link rel="stylesheet" href="../panel/panel.css">
  <style>
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
  </style>
</head>
<body>
  <h1>Music Steer</h1>
  <section class="card">
    <h2>Anthropic API key</h2>
    <p class="muted">Stored only in this browser (<code>chrome.storage.local</code>). It is sent only to api.anthropic.com.</p>
    <div class="row">
      <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <button id="show" type="button" class="ghost">Show</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="save" type="button">Save</button>
      <button id="test" type="button" class="ghost">Test key</button>
      <button id="clear" type="button" class="ghost danger">Remove key</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
